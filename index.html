<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="app-version" content="2026-10-07-2">
<title>Minecraft AI</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background: #07130c;
}

/* =========================
   ANIMATSIYALI MINECRAFT FON
========================= */

.scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -10;
    background:
        linear-gradient(
            180deg,
            #1689d7 0%,
            #55c8ff 42%,
            #79c84a 68%,
            #183b19 100%
        );
}

.sun {
    position: absolute;
    width: 85px;
    height: 85px;
    right: 30px;
    top: 55px;
    background: #ffe36e;
    box-shadow:
        0 0 35px #ffe36e,
        0 0 90px rgba(255,227,110,.5);
    animation: sun 7s ease-in-out infinite alternate;
}

@keyframes sun {
    from { transform: translateY(0); }
    to { transform: translateY(15px); }
}

.cloud {
    position: absolute;
    width: 170px;
    height: 40px;
    background: rgba(255,255,255,.8);
    border-radius: 5px;
    animation: clouds linear infinite;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
}

.cloud::before {
    width: 70px;
    height: 70px;
    left: 25px;
    bottom: 0;
}

.cloud::after {
    width: 80px;
    height: 80px;
    left: 80px;
    bottom: 0;
}

.cloud.one {
    top: 90px;
    left: -220px;
    animation-duration: 35s;
}

.cloud.two {
    top: 175px;
    left: -300px;
    transform: scale(.7);
    animation-duration: 48s;
    animation-delay: 5s;
}

@keyframes clouds {
    from {
        transform: translateX(-250px);
    }

    to {
        transform: translateX(calc(100vw + 350px));
    }
}

/* Tog‘lar */

.mountain {
    position: absolute;
    bottom: 85px;
    width: 0;
    height: 0;
    border-left: 190px solid transparent;
    border-right: 190px solid transparent;
    border-bottom: 260px solid #315b3a;
}

.m1 {
    left: -120px;
}

.m2 {
    left: 130px;
    transform: scale(1.2);
    border-bottom-color: #24462e;
}

.m3 {
    right: -130px;
    transform: scale(1.1);
    border-bottom-color: #1c3927;
}

/* Yer */

.ground {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 110px;

    background:
        linear-gradient(
            #5dbb3c 0 20%,
            #70471e 20% 100%
        );

    box-shadow:
        0 -8px 25px rgba(0,0,0,.25);
}

/* Zarrachalar */

.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: rgba(255,255,255,.65);
    animation: particles 8s linear infinite;
}

.p1 { left: 12%; bottom: -10px; animation-delay: 0s; }
.p2 { left: 34%; bottom: -10px; animation-delay: 2s; }
.p3 { left: 61%; bottom: -10px; animation-delay: 4s; }
.p4 { left: 82%; bottom: -10px; animation-delay: 1s; }

@keyframes particles {
    0% {
        transform: translateY(0);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform: translateY(-90vh);
        opacity: 0;
    }
}

/* =========================
   ASOSIY KONTAINER
========================= */

.app {
    width: min(94%, 620px);
    margin: auto;
    padding:
        max(22px, env(safe-area-inset-top))
        0
        100px;
}

/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    padding: 22px 10px 18px;
}

.logo {
    font-size: 58px;
    filter:
        drop-shadow(0 7px 5px rgba(0,0,0,.5));
    animation: logo 3s ease-in-out infinite;
}

@keyframes logo {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

.title {
    margin-top: 8px;
    font-size: 31px;
    font-weight: 900;
    letter-spacing: 1px;

    text-shadow:
        0 4px 0 #222,
        0 7px 20px rgba(0,0,0,.65);
}

.subtitle {
    margin-top: 6px;
    font-size: 13px;
    opacity: .88;
}

/* =========================
   AI STATUS
========================= */

.status {
    display: flex;
    align-items: center;
    gap: 9px;

    width: fit-content;
    margin: 10px auto 20px;

    padding: 8px 13px;

    border-radius: 20px;

    background: rgba(0,0,0,.45);
    backdrop-filter: blur(10px);

    font-size: 12px;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #51ff6a;
    box-shadow: 0 0 10px #51ff6a;

    animation: blink 1.5s infinite;
}

@keyframes blink {
    50% {
        opacity: .3;
    }
}

/* =========================
   MENU
========================= */

.menu {
    display: grid;
    gap: 12px;
}

.card {
    position: relative;
    overflow: hidden;

    padding: 12px;

    border:
        1px solid rgba(255,255,255,.15);

    border-radius: 22px;

    background:
        rgba(10,15,12,.66);

    backdrop-filter: blur(15px);

    box-shadow:
        0 15px 40px rgba(0,0,0,.32),
        inset 0 1px rgba(255,255,255,.08);
}

/* Yorug‘lik effekti */

.card::after {
    content: "";
    position: absolute;
    width: 150px;
    height: 300px;

    top: -100px;
    left: -200px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.08),
            transparent
        );

    transform: rotate(20deg);

    animation: shine 7s infinite;
}

@keyframes shine {
    0%,65% {
        left: -200px;
    }

    85%,100% {
        left: 800px;
    }
}

/* =========================
   TUGMALAR
========================= */

.button {
    position: relative;
    z-index: 2;

    width: 100%;
    min-height: 72px;

    display: flex;
    align-items: center;
    gap: 14px;

    border: 0;
    border-radius: 17px;

    color: white;
    text-align: left;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.10),
            rgba(0,0,0,.28)
        );

    cursor: pointer;

    transition:
        transform .15s,
        background .15s;
}

.button + .button {
    margin-top: 8px;
}

.button:active {
    transform: scale(.97);
    background: rgba(255,255,255,.16);
}

.icon {
    width: 52px;
    height: 52px;

    display: grid;
    place-items: center;

    flex-shrink: 0;

    border-radius: 15px;

    background:
        rgba(255,255,255,.10);

    font-size: 27px;

    box-shadow:
        inset 0 1px rgba(255,255,255,.12);
}

.text {
    flex: 1;
}

.name {
    font-size: 16px;
    font-weight: 800;
}

.desc {
    margin-top: 4px;
    font-size: 12px;
    opacity: .58;
}

.arrow {
    padding-right: 8px;
    font-size: 20px;
    opacity: .45;
}

/* =========================
   PASTKI MENU
========================= */

.bottom {
    position: fixed;

    left: 50%;
    bottom: 12px;

    transform: translateX(-50%);

    width: min(92%, 590px);

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 9px;

    padding: 8px;

    border:
        1px solid rgba(255,255,255,.13);

    border-radius: 18px;

    background:
        rgba(5,10,7,.78);

    backdrop-filter: blur(18px);

    box-shadow:
        0 10px 35px rgba(0,0,0,.45);

    z-index: 20;
}

.bottom button {
    border: 0;

    padding: 13px;

    border-radius: 13px;

    color: white;

    background:
        rgba(255,255,255,.07);

    font-weight: 700;

    cursor: pointer;
}

.bottom button:active {
    transform: scale(.96);
}

/* =========================
   OYNA
========================= */

.modal {
    position: fixed;
    inset: 0;

    display: none;
    align-items: flex-end;
    justify-content: center;

    padding: 14px;

    background:
        rgba(0,0,0,.72);

    backdrop-filter: blur(8px);

    z-index: 100;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(600px,100%);
    max-height: 85vh;

    overflow-y: auto;

    padding: 20px;

    border:
        1px solid rgba(255,255,255,.14);

    border-radius: 24px 24px 16px 16px;

    background:
        #121914;

    box-shadow:
        0 20px 70px rgba(0,0,0,.6);

    animation: modal .22s ease;
}

@keyframes modal {
    from {
        transform: translateY(100%);
    }

    to {
        transform: translateY(0);
    }
}

.modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 17px;
}

.modal-title {
    font-size: 21px;
    font-weight: 900;
}

.close {
    width: 38px;
    height: 38px;

    border: 0;
    border-radius: 11px;

    background:
        rgba(255,255,255,.08);

    color: white;

    font-size: 18px;
}

/* Qidiruv */

.search {
    width: 100%;

    padding: 15px;

    border:
        1px solid rgba(255,255,255,.1);

    border-radius: 13px;

    outline: none;

    background:
        rgba(255,255,255,.07);

    color: white;

    font-size: 14px;

    margin-bottom: 10px;
}

.search::placeholder {
    color: rgba(255,255,255,.45);
}

/* Natija */

.result {
    padding: 15px;

    margin-top: 9px;

    border-radius: 14px;

    background:
        rgba(255,255,255,.06);
}

.result-title {
    font-weight: 800;
}

.result-desc {
    margin-top: 5px;
    font-size: 12px;
    opacity: .62;
}

.code {
    margin-top: 10px;

    padding: 11px;

    overflow-x: auto;

    border-radius: 9px;

    background: #050805;

    color: #8cff65;

    font-family: monospace;
    font-size: 12px;
}

/* AI input */

.ai-input {
    width: 100%;

    min-height: 110px;

    resize: none;

    padding: 14px;

    border:
        1px solid rgba(255,255,255,.1);

    border-radius: 14px;

    outline: none;

    background:
        rgba(255,255,255,.06);

    color: white;

    font-family: inherit;
}

.primary {
    width: 100%;

    margin-top: 10px;

    padding: 15px;

    border: 0;

    border-radius: 13px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #36a852,
            #167c35
        );

    font-size: 15px;
    font-weight: 800;
}

/* =========================
   FOOTER
========================= */

.footer {
    margin-top: 25px;

    text-align: center;

    font-size: 10px;

    opacity: .45;
}
</style>
</head>

<body>

<!-- MINECRAFT OLAMI -->

<div class="scene">

    <div class="sun"></div>

    <div class="cloud one"></div>
    <div class="cloud two"></div>

    <div class="mountain m1"></div>
    <div class="mountain m2"></div>
    <div class="mountain m3"></div>

    <div class="ground"></div>

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>

</div>


<!-- ILOVA -->

<div class="app">

    <header class="header">

        <div class="logo">
            🎮🤖
        </div>

        <div class="title">
            MINECRAFT AI
        </div>

        <div class="subtitle">
            Minecraft olamidagi aqlli yordamchingiz
        </div>

    </header>


    <div class="status">

        <span class="status-dot"></span>

        AI yordamchi faol

    </div>


    <main class="menu">

        <div class="card">

            <button
                class="button"
                onclick="commands()"
            >

                <div class="icon">
                    🧩
                </div>

                <div class="text">

                    <div class="name">

                    </div>

                    <div class="desc">

                    </div>

                </div>

                <div class="arrow">

                </div>

            </button>


            <button
                class="button"
                onclick="ai()"
            >

                <div class="icon">
                    🤖
                </div>

                <div class="text">

                    <div class="name">
                        AI yordamchi
                    </div>

                    <div class="desc">
                        Minecraft haqida AI'dan so‘rang
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            </button>


            <button
                class="button"
                onclick="recipes()"
            >

                <div class="icon">

                </div>

                <div class="text">

                    <div class="name">

                    </div>

                    </div>

                </div>

            <button
                class="button"
                onclick="tools()"
            >

                <div class="icon">

                </div>

                <div class="text">

                    </div>

                    </div>

        </div>

    <div class="footer">

    </div>

</div>


<!-- PASTKI NAVIGATSIYA -->

<nav class="bottom">

    <button onclick="profile()">
        👤 Profil
    </button>

    <button onclick="settings()">
        ⚙️ Sozlamalar
    </button>

</nav>


<!-- MODAL -->

<div
    class="modal"
    id="modal"
    onclick="outside(event)"
>

    <div
        class="modal-box"
        onclick="event.stopPropagation()"
    >

        <div class="modal-head">

            <div
                class="modal-title"
                id="modalTitle"
            >
                Minecraft AI
            </div>

            <button
                class="close"
                onclick="closeModal()"
            >
                ✕
            </button>

        </div>

        <div id="modalContent"></div>

    </div>

</div>


<script>

const tg = window.Telegram?.WebApp || {
    ready: () => {},
    expand: () => {},
    showAlert: (message) => alert(message),
    HapticFeedback: null
};

tg.ready();
tg.expand();


/* =========================
   MODAL
========================= */

function openModal(title, content) {

    document.getElementById("modalTitle").innerText = title;

    document.getElementById("modalContent").innerHTML = content;

    document.getElementById("modal").classList.add("show");

    if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred("light");
    }
}


function closeModal() {

    document
        .getElementById("modal")
        .classList.remove("show");
}


function outside(event) {

    if (event.target.id === "modal") {
        closeModal();
    }

}


/* =========================
   BUYRUQLAR
========================= */

   AI
========================= */

function ai() {

    openModal(

        "🤖 AI yordamchi",

        `
        <p style="opacity:.65">
            Minecraft haqida savolingizni yozing.
        </p>

        <textarea
            class="ai-input"
            id="aiQuestion"
            placeholder="Masalan: Netherga kirish uchun nimalar kerak?"
        ></textarea>

        <button
            class="primary"
            onclick="askAI()"
        >
            🤖 AI'dan so‘rash
        </button>

        <div
           id="aiAnswer"
            class="result"
            style="display:none"
        ></div>
        `

    );

}



async function askAI() {

    const question =
        document
            .getElementById("aiQuestion")
            .value
            .trim();

    if (!question) {
        tg.showAlert("Savolingizni yozing.");
        return;
    }

    const answer =
        document.getElementById("aiAnswer");

    answer.style.display = "block";

    answer.innerHTML = `
        <div class="result-title">
            🤖 AI
        </div>

        <div class="result-desc">
            ⏳ Javob tayyorlanmoqda...
        </div>
    `;

    try {

        const response = await fetch(
            "https://hardly-interaction-courts-antibodies.trycloudflare.com/api/ai",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    question: question
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Server xatosi"
            );
        }

        answer.innerHTML = `
            <div class="result-title">
                🤖 AI
            </div>

            <div class="result-desc" style="white-space:pre-wrap;">
                ${escapeHtml(data.answer)}
            </div>
        `;

    } catch (error) {

        answer.innerHTML = `
            <div class="result-title">
                ❌ Xatolik
            </div>

            <div class="result-desc">
                ${escapeHtml(error.message)}
            </div>
        `;
    }
}
function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

</script><script src="extra.js"></script>
